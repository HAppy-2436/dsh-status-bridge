name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing (OIDC) 需要 npm CLI >= 11.5.1（Node 24 自带的通常已满足，这里确保最新）。
      - name: Ensure recent npm CLI
        run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`tag ${tag} does not match package.json version ${pkg.version}`);
              process.exit(1);
            }
          '
      - name: Syntax check
        run: npm run check
      - name: Unit and integration tests
        run: npm test
      # 已发布过的版本直接跳过（例如用 GitHub Release 创建 tag 时），保证 workflow 可重跑。
      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-status-bridge@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "dsh-status-bridge@$version already exists on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 走 npm Trusted Publishing（OIDC）：不需要 NPM_TOKEN / OTP。
      # 前提：npmjs.com → 包 dsh-status-bridge 的 Settings → Trusted Publisher 已配置：
      #   Provider=GitHub Actions, Owner=HAppy-2436, Repository=dsh-status-bridge,
      #   Workflow filename=publish.yml, 并勾选允许 npm publish（直接发布）。
      - name: Publish to npm (trusted publishing)
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public --provenance
